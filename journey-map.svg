<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#1e2b4d"/>
    </pattern>
    <linearGradient id="arc" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <style>
      .t{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .route{stroke-dasharray:10 10;animation:flow 1.2s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-20}}
    </style>
  </defs>
  <rect width="1200" height="320" rx="18" fill="#0b1020"/>
  <rect width="1200" height="320" rx="18" fill="url(#dots)"/>

  <!-- route: Bangalore (right) to Dallas (left) -->
  <path id="r" class="route" d="M960 230 C 820 20, 380 20, 240 200" fill="none" stroke="url(#arc)" stroke-width="4" stroke-linecap="round"/>
  <g>
    <text font-size="30" dy="10" text-anchor="middle">✈️
      <animateMotion dur="7s" repeatCount="indefinite" rotate="0"><mpath href="#r"/></animateMotion>
    </text>
  </g>

  <g class="t">
    <circle cx="960" cy="230" r="10" fill="#2dd4bf"/>
    <circle cx="960" cy="230" r="22" fill="none" stroke="#2dd4bf" stroke-opacity=".4"/>
    <text x="960" y="276" fill="#f1f5f9" font-size="22" font-weight="800" text-anchor="middle">Bangalore</text>
    <text x="960" y="298" fill="#94a3b8" font-size="14" text-anchor="middle">7+ years in production engineering</text>

    <circle cx="240" cy="200" r="10" fill="#f59e0b"/>
    <circle cx="240" cy="200" r="22" fill="none" stroke="#f59e0b" stroke-opacity=".4"/>
    <text x="240" y="246" fill="#f1f5f9" font-size="22" font-weight="800" text-anchor="middle">Dallas</text>
    <text x="240" y="268" fill="#94a3b8" font-size="14" text-anchor="middle">MS at UT Dallas · building on AWS</text>

    <text x="600" y="150" fill="#e2e8f0" font-size="26" font-weight="800" text-anchor="middle">~14,900 km</text>
    <text x="600" y="176" fill="#64748b" font-size="15" text-anchor="middle">one career, restarted on purpose</text>
  </g>
</svg>
