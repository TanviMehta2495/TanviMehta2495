<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1d2a4a" stroke-width="1"/>
    </pattern>
    <style>
      .t{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .beat{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 4s ease-in-out infinite}
      @keyframes draw{0%{stroke-dashoffset:1400}60%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
      .dot{animation:blink 1.6s ease-in-out infinite}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
    </style>
  </defs>
  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)" opacity=".55"/>

  <!-- heartbeat / uptime line -->
  <path class="beat" d="M0 300 H560 L580 300 L594 272 L608 326 L624 256 L640 300 H820 L838 300 L852 282 L866 316 L880 300 H1200"
        fill="none" stroke="url(#pulse)" stroke-width="3" stroke-linejoin="round"/>

  <g class="t">
    <text x="64" y="92" fill="#94a3b8" font-size="18" letter-spacing="4">HI, I'M</text>
    <text x="64" y="158" fill="#f8fafc" font-size="64" font-weight="800">Tanvi Mehta</text>
    <text x="64" y="202" fill="#2dd4bf" font-size="24" font-weight="600">Site Reliability Engineer · Cloud · Performance</text>
    <text x="64" y="236" fill="#cbd5e1" font-size="18">7+ years keeping production alive, from Bangalore to Dallas.</text>
  </g>

  <!-- status pill -->
  <g class="t" transform="translate(890,70)">
    <rect width="250" height="44" rx="22" fill="#0f2a2a" stroke="#2dd4bf" stroke-opacity=".5"/>
    <circle class="dot" cx="26" cy="22" r="7" fill="#22c55e"/>
    <text x="44" y="28" fill="#e2e8f0" font-size="16" font-weight="600">status: all systems go</text>
  </g>
  <g class="t" transform="translate(890,126)">
    <text x="0" y="16" fill="#64748b" font-size="14">uptime of curiosity</text>
    <text x="250" y="16" fill="#f59e0b" font-size="14" font-weight="700" text-anchor="end">99.99%</text>
    <rect y="26" width="250" height="8" rx="4" fill="#1e293b"/>
    <rect y="26" width="249" height="8" rx="4" fill="#f59e0b"/>
  </g>
</svg>
