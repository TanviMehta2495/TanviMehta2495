<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <style>
      .t{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .box{fill:#111a30;stroke:#334155;stroke-width:1.5}
      .n{font-size:15px;font-weight:700;fill:#f1f5f9}
      .d{font-size:12px;fill:#94a3b8}
      .e{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#a)}
      .lbl{font-size:12px;font-weight:700}
      .loop{stroke:#22c55e;stroke-width:2;fill:none;stroke-dasharray:6 8;animation:f 1.2s linear infinite;marker-end:url(#a)}
      @keyframes f{to{stroke-dashoffset:-14}}
    </style>
  </defs>
  <rect width="1200" height="440" rx="18" fill="#0b1020"/>
  <g class="t">
    <text x="40" y="44" fill="#64748b" font-size="14" letter-spacing="3">AiOcr · ADAPTIVE EXTRACTION THAT LEARNS FROM APPROVED RESULTS</text>

    <rect class="box" x="40" y="160" width="140" height="70" rx="12"/>
    <text x="110" y="190" class="n" text-anchor="middle">📄 Upload</text>
    <text x="110" y="210" class="d" text-anchor="middle">PDF · txt · md · json</text>

    <rect class="box" x="220" y="160" width="150" height="70" rx="12"/>
    <text x="295" y="190" class="n" text-anchor="middle">Parse</text>
    <text x="295" y="210" class="d" text-anchor="middle">pdfplumber · pypdf</text>

    <rect class="box" x="410" y="160" width="160" height="70" rx="12" style="stroke:#f59e0b"/>
    <text x="490" y="190" class="n" text-anchor="middle">Signature</text>
    <text x="490" y="210" class="d" text-anchor="middle">fingerprint the layout</text>

    <!-- branches -->
    <rect class="box" x="640" y="80" width="200" height="62" rx="12" style="stroke:#2dd4bf"/>
    <text x="740" y="106" class="n" text-anchor="middle">Template memory</text>
    <text x="740" y="126" class="d" text-anchor="middle">known layout · no LLM call</text>
    <rect class="box" x="640" y="248" width="200" height="62" rx="12" style="stroke:#a78bfa"/>
    <text x="740" y="274" class="n" text-anchor="middle">Rules + LLM assist</text>
    <text x="740" y="294" class="d" text-anchor="middle">new layout · strict JSON</text>

    <text x="600" y="128" class="lbl" fill="#2dd4bf" text-anchor="end">match</text>
    <text x="600" y="268" class="lbl" fill="#a78bfa" text-anchor="end">new</text>

    <rect class="box" x="890" y="160" width="130" height="70" rx="12"/>
    <text x="955" y="190" class="n" text-anchor="middle">Validate</text>
    <text x="955" y="210" class="d" text-anchor="middle">fields · dates · totals</text>

    <rect class="box" x="1050" y="160" width="120" height="70" rx="12" style="stroke:#f472b6"/>
    <text x="1110" y="190" class="n" text-anchor="middle">🧑 Review</text>
    <text x="1110" y="210" class="d" text-anchor="middle">human-in-loop</text>

    <rect class="box" x="890" y="330" width="280" height="62" rx="12"/>
    <text x="1030" y="356" class="n" text-anchor="middle">Store</text>
    <text x="1030" y="376" class="d" text-anchor="middle">JSON · CSV · SQLite · trace logs</text>

    <path class="e" d="M180 195 H216"/>
    <path class="e" d="M370 195 H406"/>
    <path class="e" d="M570 185 C610 185 600 111 636 111"/>
    <path class="e" d="M570 205 C610 205 600 279 636 279"/>
    <path class="e" d="M840 111 C870 111 860 185 886 185"/>
    <path class="e" d="M840 279 C870 279 860 205 886 205"/>
    <path class="e" d="M1020 195 H1046"/>
    <path class="e" d="M1110 230 V326"/>
    <!-- learning loop -->
    <path class="loop" d="M890 372 H622 V62 H740 V76"/>
    <text x="640" y="412" class="lbl" fill="#22c55e">approved results teach template memory → fewer LLM calls over time</text>
  </g>
</svg>
