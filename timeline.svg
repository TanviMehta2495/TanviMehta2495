<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <style>
    .t{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .y{font-size:22px;font-weight:800}
    .h{font-size:16px;font-weight:700;fill:#f1f5f9}
    .s{font-size:13px;fill:#94a3b8}
    .now{animation:ring 2s ease-out infinite;transform-origin:1100px 140px}
    @keyframes ring{0%{r:12;opacity:.9}100%{r:30;opacity:0}}
  </style>
  <rect width="1200" height="280" rx="18" fill="#0b1020"/>
  <text x="40" y="44" class="t" fill="#64748b" font-size="14" letter-spacing="3">THE JOURNEY SO FAR</text>

  <line x1="100" y1="140" x2="1100" y2="140" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <line x1="100" y1="140" x2="1100" y2="140" stroke="#2dd4bf" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 14" opacity=".6"/>

  <g class="t">
    <!-- 2017 -->
    <circle cx="100" cy="140" r="12" fill="#0b1020" stroke="#a78bfa" stroke-width="4"/>
    <text x="100" y="100" class="y" fill="#a78bfa" text-anchor="middle">2017</text>
    <text x="100" y="186" class="h" text-anchor="middle">B.E. graduate</text>
    <text x="100" y="206" class="s" text-anchor="middle">NMIT, Karnataka</text>

    <!-- 2017 Infosys -->
    <circle cx="300" cy="140" r="12" fill="#0b1020" stroke="#60a5fa" stroke-width="4"/>
    <text x="300" y="100" class="y" fill="#60a5fa" text-anchor="middle">2017–21</text>
    <text x="300" y="186" class="h" text-anchor="middle">Infosys</text>
    <text x="300" y="206" class="s" text-anchor="middle">Senior Systems Engineer</text>

    <!-- 2021 Lowe's -->
    <circle cx="520" cy="140" r="12" fill="#0b1020" stroke="#2dd4bf" stroke-width="4"/>
    <text x="520" y="100" class="y" fill="#2dd4bf" text-anchor="middle">2021–25</text>
    <text x="520" y="186" class="h" text-anchor="middle">Lowe's</text>
    <text x="520" y="206" class="s" text-anchor="middle">Senior Software Engineer · SRE</text>

    <!-- 2025 leap -->
    <circle cx="720" cy="140" r="12" fill="#0b1020" stroke="#f472b6" stroke-width="4"/>
    <text x="720" y="100" class="y" fill="#f472b6" text-anchor="middle">2025</text>
    <text x="720" y="186" class="h" text-anchor="middle">The leap ✈</text>
    <text x="720" y="206" class="s" text-anchor="middle">Bangalore → Dallas</text>

    <!-- 2026 UTD -->
    <circle cx="910" cy="140" r="12" fill="#0b1020" stroke="#f59e0b" stroke-width="4"/>
    <text x="910" y="100" class="y" fill="#f59e0b" text-anchor="middle">2026</text>
    <text x="910" y="186" class="h" text-anchor="middle">UT Dallas</text>
    <text x="910" y="206" class="s" text-anchor="middle">MS ITM · AWS builder</text>

    <!-- 2027 -->
    <circle class="now" cx="1100" cy="140" r="12" fill="none" stroke="#22c55e" stroke-width="3"/>
    <circle cx="1100" cy="140" r="12" fill="#22c55e"/>
    <text x="1100" y="100" class="y" fill="#22c55e" text-anchor="middle">2027</text>
    <text x="1100" y="186" class="h" text-anchor="middle">What's next</text>
    <text x="1100" y="206" class="s" text-anchor="middle">MS graduation · May</text>
  </g>
</svg>
